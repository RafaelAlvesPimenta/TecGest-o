<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Estoque.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Estoque de Matérias-Primas</title>
    <link rel="icon" href="./imagens/icon logo TecGestão.png" type="image/x-icon">
</head>
<body>
    <nav class="menu-lateral">
        <div class="bnt-expandir">
            <i class="bi bi-list"></i>
        </div>
        <ul>
            <li class="item-menu">
                <a href="Telainicial.html">
                    <span class="icon"><i class="bi bi-house"></i></span>
                    <span class="txt-link">Início</span>
                </a>
            </li>
            <li class="item-menu">
                <a href="planilhas.html">
                    <span class="icon"><i class="bi bi-collection"></i></span>
                    <span class="txt-link">Planilhas</span>
                </a>
            </li>
            <li class="item-menu">
                <a href="Estoque.html">
                    <span class="icon"><i class="bi bi-box-seam"></i></span>
                    <span class="txt-link">Estoque</span>
                </a>
            </li>
            <li class="item-menu">
                <a href="produtos.html">
                    <span class="icon"><i class="bi bi-cart3"></i></span>
                    <span class="txt-link">Produtos</span>
                </a>
            </li>
            <li class="item-menu">
                <a href="Vendas.html">
                    <span class="icon"><i class="bi bi-coin"></i></span>
                    <span class="txt-link">Vendas</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="container">
        <!-- Filtro de Categoria -->
        <div class="filtros">
            <label for="categoria">Selecione a categoria:</label>
            <select id="categoria" name="categoria" onchange="filtrarCategoria()">
                <option value="all">Todos</option>
                <option value="Tecido">Tecido</option>
                <option value="Linha">Linha</option>
                <option value="Botões">Botões</option>
                <option value="Outros">Outros</option>
            </select>
        </div>

        <!-- Avisos de Falta de Produtos -->
        <div class="aviso-falta" id="aviso-falta">
            <h2>Produtos em falta:</h2>
            <ul id="aviso-falta-lista">
                <!-- Avisos de falta de produtos serão inseridos aqui -->
            </ul>
        </div>

        <!-- Lista de Produtos -->
        <div class="cards-container" id="cards-container">
            <!-- Cards de materiais serão inseridos aqui via JavaScript -->
        </div>
    </div>

    <script src="estoque.js"></script>
</body>
</html>
