<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel= "icon" class="icon.logo" href="./imagens/icon logo TecGestão.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<body>
    <link rel="stylesheet" href="Login.css">

    <div class="Container">
        <form action="Telainicial.html" method="get">
            <h1>Entrar Na Plataforma</h1>
            <div>

            <div class="input-container">
                
            
                <input placeholder="Usuario" type="user" required>
                <img width="20" height="20" src="https://img.icons8.com/ios/50/user--v1.png" alt="user--v1"/ class="user-icon">
            </div>
            

           

                <div class="input-container">
                    <input placeholder="CPF/CNPJ" type="password" required>
                    <img width="20" height="20" src="./imagens/1176652.png" alt="lock--v1"/ class="lock-icon">
                    
                    <a href="#"></a>
                </div>

                <div class="input-container">
                    <input placeholder="Senha" type="password" required>
                    <img width="20" height="20" src="https://img.icons8.com/ios/50/lock--v1.png" alt="lock--v1"/ class="lock-icon">
                    <a href="#">Esqueci Minha Senha</a>
                    </div>
            
            <button  type="submit" class="submit-button"><a class="input-botao-entrar" href="Telainicial.html">Entrar</A></button>
            <div class="Register-link">
                <p>Não Esta cadastrado ? <a href="cadastro.html">Cadastrar</a></p>
            </div>
        </form>

    </div>

    
</body>
</html>
